openapi: 3.1.0
info:
  title: Liner Notes API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/search:
    get:
      summary: Search the federated music catalog
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, maxLength: 200 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200": { description: Ranked local and provider results }
  /api/v1/agent/conversations:
    post:
      summary: Start a grounded music conversation
      responses:
        "201": { description: Conversation created }
  /api/v1/agent/conversations/{conversationId}/messages:
    post:
      summary: Ask a grounded music question
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Answer with citations and confidence }
        "404": { description: Conversation not found }
  /api/v1/library:
    get:
      summary: List the authenticated user's saved recordings
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Private saved library }
        "401": { description: Authentication required }
    post:
      summary: Save a recording
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Recording saved }
  /api/v1/history:
    get:
      summary: List private search history
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Search history }
  /api/health:
    get:
      summary: Readiness probe
      responses:
        "200": { description: Service ready }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
